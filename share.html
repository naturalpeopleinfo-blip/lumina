<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Zone | 修正指示ページ</title>
  <style>
    :root {
      --bg: #eef4fb;
      --card: rgba(255, 255, 255, 0.94);
      --line: rgba(15, 23, 42, 0.08);
      --text: #0f172a;
      --muted: #64748b;
      --blue: #7ea8ff;
      --blue-strong: #5b8cff;
      --green: #6fcf83;
      --green-strong: #49b869;
      --shadow: 0 18px 36px rgba(15, 23, 42, 0.08);
      --radius-xl: 30px;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Display", "Hiragino Sans", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(126, 168, 255, 0.18), transparent 32%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .share-shell {
      width: min(1440px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .share-brand img {
      width: 78px;
      height: 78px;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .share-button {
      border: 1px solid rgba(15, 23, 42, 0.06);
      border-radius: 999px;
      padding: 16px 28px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
    }

    .share-button:hover { transform: translateY(-1px); }
    .share-button:disabled { opacity: 0.6; cursor: progress; }
    .share-button--copy { background: linear-gradient(180deg, var(--green), var(--green-strong)); color: #fff; }
    .share-button--ghost { background: #fff; color: var(--text); }

    .share-header {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 18px 22px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .share-header-main {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .share-header-copy {
      min-width: 0;
      flex: 1 1 auto;
    }

    .share-file {
      margin: 0 0 8px;
      font-size: clamp(1.35rem, 2vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .share-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .share-expiry-note {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 0.84rem;
      line-height: 1.55;
      font-weight: 600;
    }

    .share-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .share-meta-label {
      font-size: 0.78rem;
      color: #94a3b8;
      font-weight: 700;
    }

    .share-meta-divider {
      color: rgba(100, 116, 139, 0.55);
      font-weight: 700;
    }

    .share-platforms {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .share-platform-icon {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.24);
    }

    .share-platform-icon--tiktok { background: linear-gradient(180deg, #132531, #0f172a 74%); }
    .share-platform-icon--reels { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 7%, #fd5949 34%, #d6249f 61%, #285aeb 100%); }
    .share-platform-icon--shorts { background: linear-gradient(180deg, #ff4d67, #ff2d55); }
    .share-platform-icon--all { background: linear-gradient(180deg, #5fe172, #34c759); }

    .share-layout {
      display: grid;
      grid-template-columns: minmax(0, 58%) minmax(340px, 42%);
      gap: 18px;
    }

    .share-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .share-preview-card {
      padding: 22px;
    }

    .share-preview-shell {
      background: #f8fbff;
      border: 1px solid rgba(37, 99, 235, 0.1);
      border-radius: 24px;
      padding: 18px;
    }

    .share-preview-media {
      position: relative;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .share-preview-image {
      width: min(100%, 392px);
      max-height: 646px;
      border-radius: 24px;
      box-shadow: 0 18px 32px rgba(15, 23, 42, 0.14);
      display: block;
    }

    .share-pin-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .share-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 4px solid rgba(255,255,255,0.92);
      color: #fff;
      font-size: 1rem;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 26px rgba(15, 23, 42, 0.18);
      opacity: 0.45;
      transition: transform 180ms ease, opacity 180ms ease, box-shadow 180ms ease;
    }

    .share-pin.is-active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 0 0 10px rgba(91, 140, 255, 0.15), 0 18px 30px rgba(15, 23, 42, 0.2);
    }

    .share-pin--high { background: #e8554c; }
    .share-pin--medium { background: #f2ab34; }
    .share-pin--low { background: #64748b; }

    .share-preview-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

    .share-preview-nav button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .share-preview-nav button:disabled { opacity: 0.4; cursor: default; }
    .share-preview-nav strong { font-size: 0.92rem; color: var(--muted); }

    .share-panel {
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    .share-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .share-panel-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
    }

    .share-panel-count {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .share-instruction-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .share-instruction {
      width: 100%;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: #fff;
      border-radius: 20px;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .share-instruction:hover,
    .share-instruction.is-active {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(15, 23, 42, 0.08);
      border-color: rgba(91, 140, 255, 0.28);
    }

    .share-instruction-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .share-instruction-main {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .share-no-badge {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .share-no-badge--high { background: #e8554c; }
    .share-no-badge--medium { background: #f2ab34; }
    .share-no-badge--low { background: #64748b; }

    .share-time {
      font-size: 1rem;
      font-weight: 800;
    }

    .share-position {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 600;
    }

    .share-status {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .share-status:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(15, 23, 42, 0.1); }
    .share-status-icon {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.58);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.76rem;
      opacity: 0.82;
    }

    .share-status--pending { background: rgba(71,85,105,0.12); border-color: rgba(71,85,105,0.2); color: #475569; }
    .share-status--done { background: rgba(22,163,74,0.14); border-color: rgba(22,163,74,0.24); color: #166534; }

    .share-note {
      background: rgba(245, 158, 11, 0.08);
      border-radius: 16px;
      padding: 12px 14px;
      color: #1f2937;
    }

    .share-note span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .share-note p {
      margin: 0;
      line-height: 1.5;
      font-size: 0.93rem;
      font-weight: 600;
    }

    .share-state {
      min-height: 300px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .share-hidden { display: none !important; }

    @media (max-width: 980px) {
      .share-shell { width: min(100% - 28px, 980px); padding-top: 20px; }
      .share-header {
        flex-direction: column;
        align-items: stretch;
      }
      .share-header-main {
        align-items: flex-start;
      }
      .share-brand img { width: 68px; height: 68px; }
      .share-header .share-button { width: 100%; }
      .share-layout { grid-template-columns: 1fr; }
      .share-preview-media { min-height: 360px; }
    }
  </style>
</head>
<body>
  <div class="share-shell">
    <div id="shareLoading" class="share-state">共有ページを読み込んでいます…</div>
    <div id="shareExpired" class="share-state share-hidden">
      <div>
        <h1>この共有URLの有効期限は切れています。</h1>
        <p>共有URLは発行日から7日後に失効します。必要な場合は、もう一度共有URLを発行してください。</p>
      </div>
    </div>
    <div id="shareError" class="share-state share-hidden">
      <div>
        <h1>共有ページを開けませんでした。</h1>
        <p id="shareErrorCopy">URLをご確認のうえ、再度お試しください。</p>
      </div>
    </div>

    <div id="shareApp" class="share-hidden">
      <header class="share-header">
        <div class="share-header-main">
          <div class="share-brand">
            <img src="./assets/logo_new_blue.PNG" alt="Lumina Zone">
          </div>
          <div class="share-header-copy">
            <h1 id="shareFileName" class="share-file">--</h1>
            <div id="shareMeta" class="share-meta"></div>
            <p id="shareExpiryNote" class="share-expiry-note"></p>
          </div>
        </div>
        <button id="shareCopyButton" class="share-button share-button--copy" type="button">共有URLをコピー</button>
      </header>

      <main class="share-layout">
        <section class="share-card share-preview-card">
          <div class="share-preview-shell">
            <div class="share-preview-media">
              <img id="sharePreviewImage" class="share-preview-image" alt="共有プレビュー">
              <div id="sharePinLayer" class="share-pin-layer"></div>
            </div>
          </div>
          <div class="share-preview-nav">
            <button id="sharePrevButton" type="button">前へ</button>
            <strong><span id="shareCurrentIndex">1</span> / <span id="shareTotalCount">1</span></strong>
            <button id="shareNextButton" type="button">次へ</button>
          </div>
        </section>

        <aside class="share-card share-panel">
          <div class="share-panel-header">
            <h2 class="share-panel-title">修正指示</h2>
            <div id="shareInstructionCount" class="share-panel-count">0件</div>
          </div>
          <div id="shareInstructionList" class="share-instruction-list"></div>
        </aside>
      </main>
    </div>
  </div>

  <script src="./share.js?v=20260422-zone-pin-colors-1"></script>
</body>
</html>
